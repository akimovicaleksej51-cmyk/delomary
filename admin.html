<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — Дело Мэри</title>
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000; --black-2:#0C0C0C; --black-3:#171717;
    --ochre:#E0A722; --ochre-bright:#F5C518; --ochre-deep:#8a6a15;
    --paper:#F3EFE4; --muted:#B9B4A6; --line:#2a2a2a;
    --danger:#e5484d; --danger-bright:#ff6b6f;
    --display:'Anton','Arial Narrow',sans-serif;
    --sans:'Manrope',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--black); color:var(--paper);
    font-family:var(--sans); padding:24px 16px 60px;
  }
  h1,h2,h3{font-family:var(--display); font-weight:400; text-transform:uppercase; letter-spacing:.02em; margin:0;}
  a{color:var(--ochre-bright);}
  button{font-family:var(--sans); cursor:pointer;}
  .wrap{max-width:920px; margin:0 auto;}

  /* ---------- Login screen ---------- */
  #loginScreen{
    min-height:70vh; display:flex; align-items:center; justify-content:center;
  }
  .login-card{
    width:100%; max-width:360px; background:var(--black-2); border:1px solid #2a2a2a;
    border-radius:18px; padding:32px 28px; text-align:center;
  }
  .login-card h1{font-size:22px; margin-bottom:6px;}
  .login-card p{color:var(--muted); font-size:14px; margin:0 0 22px;}
  .pw-field{position:relative; margin-bottom:14px;}
  .pw-field input{
    width:100%; padding:13px 44px 13px 14px; border-radius:10px; border:1px solid #333;
    background:var(--black-3); color:var(--paper); font-size:15px; font-family:var(--sans);
  }
  .pw-field input:focus{outline:none; border-color:var(--ochre);}
  .pw-toggle{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--muted); padding:8px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
  }
  .pw-toggle:hover{color:var(--paper); background:#2a2a2a;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--ochre-bright); color:var(--black); border:none; font-weight:800;
    font-size:14.5px; padding:13px 20px; border-radius:10px; width:100%;
    transition:transform .15s, background .15s;
  }
  .btn:hover{background:var(--ochre);}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-secondary{
    background:transparent; color:var(--paper); border:1px solid #3a3a3a; width:auto;
  }
  .btn-secondary:hover{background:var(--black-3); border-color:#4a4a4a;}
  .btn-secondary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-danger:hover{background:var(--danger-bright);}
  .err-msg{
    color:var(--danger-bright); font-size:13.5px; margin-top:12px; min-height:1em;
  }

  /* ---------- Panel shell ---------- */
  #panel{display:none;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
    margin-bottom:26px; padding-bottom:18px; border-bottom:1px solid #262626;
  }
  .topbar h1{font-size:24px;}
  .topbar-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .btn-secondary, .btn-danger{padding:11px 18px;}

  .list-toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .list-toolbar input{
    flex:1 1 220px; min-width:0; padding:10px 14px; border-radius:9px; border:1px solid #333;
    background:var(--black-3); color:var(--paper); font-size:14px; font-family:var(--sans);
  }
  .list-toolbar input:focus{outline:none; border-color:var(--ochre);}
  .list-toolbar .btn-secondary{padding:10px 16px; font-size:13.5px; flex:0 0 auto;}
  .list-toolbar .btn-secondary.active{background:var(--ochre-bright); color:var(--black); border-color:var(--ochre-bright);}

  /* ---------- Bookings list ---------- */
  .day-group{margin-bottom:26px;}
  .day-heading{
    font-family:var(--sans); font-weight:800; font-size:13.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ochre-bright); margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .day-heading .weekend-tag{color:var(--danger-bright);}
  .booking-row{
    display:flex; align-items:center; gap:14px; background:var(--black-2);
    border:1px solid #262626; border-radius:12px; padding:13px 16px; margin-bottom:8px;
    cursor:pointer; transition:border-color .15s, background .15s;
  }
  .booking-row:hover{border-color:#3d3d3d; background:#141414;}
  .row-time{
    font-family:var(--display); font-weight:400; font-size:17px; min-width:58px; color:var(--paper);
  }
  .row-type{
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
    padding:4px 9px; border-radius:999px; flex-shrink:0;
  }
  .row-type.customer{background:rgba(224,167,34,.18); color:var(--ochre-bright);}
  .row-type.technical{background:rgba(185,180,166,.18); color:var(--muted);}
  .row-main{flex:1; min-width:0;}
  .row-name{font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-sub{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-price{font-weight:800; color:var(--ochre-bright); font-size:14.5px; flex-shrink:0;}
  .empty-note, .load-note{color:var(--muted); font-size:14.5px; padding:30px 0; text-align:center;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.72);
    align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    width:100%; max-width:480px; background:var(--black-2); border:1px solid #2c2c2c;
    border-radius:18px; padding:26px 24px; margin:auto;
  }
  .modal-box h2{font-size:19px; margin-bottom:18px;}
  .modal-close-x{
    float:right; background:none; border:none; color:var(--muted); font-size:20px; line-height:1;
    padding:4px 8px; border-radius:8px;
  }
  .modal-close-x:hover{color:var(--paper); background:#2a2a2a;}
  .detail-field{margin-bottom:14px;}
  .detail-field label{
    display:block; font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
    color:var(--muted); margin-bottom:5px;
  }
  .detail-field .value{font-size:15px; word-break:break-word;}
  .detail-field input, .detail-field textarea{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid #333;
    background:var(--black-3); color:var(--paper); font-size:14.5px; font-family:var(--sans);
  }
  .detail-field textarea{resize:vertical; min-height:64px;}
  .detail-field input:focus, .detail-field textarea:focus{outline:none; border-color:var(--ochre);}
  .modal-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:20px;}
  .modal-actions .btn, .modal-actions .btn-secondary, .modal-actions .btn-danger{width:auto; flex:1 1 auto;}
  .modal-msg{font-size:13.5px; margin-top:12px; min-height:1em;}
  .modal-msg.err{color:var(--danger-bright);}
  .modal-msg.ok{color:var(--ochre-bright);}

  /* ---------- Type toggle (customer vs technical booking) ---------- */
  .type-toggle{display:flex; gap:8px; margin-bottom:18px;}
  .type-toggle-btn{
    flex:1; padding:11px; border-radius:9px; border:1.5px solid #333; background:var(--black-3);
    color:var(--muted); font-weight:800; font-size:13px; font-family:var(--sans); text-transform:uppercase;
    letter-spacing:.03em; transition:all .15s;
  }
  .type-toggle-btn.active{background:var(--ochre-bright); color:var(--black); border-color:var(--ochre-bright);}

  /* ---------- Slot grid (reused for reschedule + technical booking) ---------- */
  .slot-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .slot-btn{
    padding:9px 14px; border-radius:9px; border:1px solid #333; background:var(--black-3);
    color:var(--paper); font-weight:700; font-size:13.5px; font-family:var(--sans);
  }
  .slot-btn:hover{border-color:var(--ochre);}
  .slot-btn.active{background:var(--ochre-bright); color:var(--black); border-color:var(--ochre-bright);}
  .slot-btn.taken{opacity:.35; cursor:not-allowed; text-decoration:line-through; pointer-events:none;}

  .day-status{
    background:var(--black-3); border:1px solid #2a2a2a; border-radius:10px;
    padding:12px 14px; font-size:13.5px; color:var(--muted); margin-bottom:14px; line-height:1.5;
  }
  .day-status b{color:var(--paper);}

  /* ---------- Stats dashboard ---------- */
  .stats-kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px;}
  .stat-tile{background:var(--black-3); border:1px solid #2a2a2a; border-radius:12px; padding:14px 12px;}
  .stat-tile .stat-label{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:6px;}
  .stat-tile .stat-value{font-family:var(--display); font-weight:400; font-size:26px; color:var(--paper); line-height:1;}
  .stat-tile.stat-completed .stat-value{color:#3ecb5e;}
  .stat-tile.stat-cancelled .stat-value{color:#e66767;}
  .stats-meter-wrap{margin-bottom:20px;}
  .stats-meter-label{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .stats-meter-label b{color:var(--paper);}
  .stats-meter-track{height:10px; border-radius:6px; background:rgba(230,103,103,.16); overflow:hidden;}
  .stats-meter-fill{height:100%; background:#e66767; border-radius:6px; transition:width .3s ease;}
  .stats-source{font-size:13px; color:var(--muted); margin-bottom:22px;}
  .stats-source b{color:var(--paper);}
  .stats-chart-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
  .stats-chart-title{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--muted);}
  .stats-legend{display:flex; gap:14px; font-size:12.5px; color:var(--muted);}
  .stats-legend span{display:inline-flex; align-items:center; gap:6px;}
  .stats-legend i{width:10px; height:10px; border-radius:3px; display:inline-block;}
  .stats-toggle-table{background:none; border:1px solid #3a3a3a; color:var(--muted); font-size:12px; padding:6px 10px; border-radius:7px;}
  .stats-toggle-table:hover{color:var(--paper); border-color:#4a4a4a;}
  .stats-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px;}
  .stats-table th, .stats-table td{padding:6px 8px; text-align:right; border-bottom:1px solid #232323; font-variant-numeric:tabular-nums;}
  .stats-table th:first-child, .stats-table td:first-child{text-align:left;}
  .stats-table th{color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase;}
  .stats-empty{color:var(--muted); font-size:13.5px; padding:20px 0; text-align:center;}

  @media (max-width:560px){
    .stats-kpis{grid-template-columns:repeat(2,1fr);}
  }

  /* ---------- Month calendar (reused for reschedule + new-booking date pick) ---------- */
  .cal-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;}
  .cal-month{font-family:var(--display); font-weight:400; text-transform:uppercase; font-size:15px; letter-spacing:.02em; color:var(--paper);}
  .cal-nav{
    width:32px; height:32px; flex-shrink:0; border-radius:9px;
    border:1.5px solid var(--line); background:var(--black-3); color:var(--paper);
    font-family:var(--sans); font-size:17px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .cal-nav:hover:not(:disabled){border-color:var(--ochre); color:var(--ochre-bright);}
  .cal-nav:disabled{opacity:.25; cursor:not-allowed;}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:6px;}
  .cal-weekdays span{text-align:center; font-family:var(--sans); font-weight:700; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.02em;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .day{
    font-family:var(--sans); font-weight:700; font-size:13px; text-align:center;
    aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    border:1.5px solid var(--line); border-radius:9px; cursor:pointer; padding:0;
    color:var(--paper); background:var(--black-3); transition:all .15s;
  }
  .day small{display:block; font-size:8.5px; font-weight:600; color:var(--muted); margin:0; text-transform:uppercase;}
  .day:not(.disabled):not(.empty):hover{border-color:var(--ochre);}
  .day.active{background:var(--ochre-bright); color:var(--black); border-color:var(--ochre-bright);}
  .day.active small{color:var(--black); opacity:.7;}
  .day.weekend small{color:var(--ochre-bright);}
  .day.active.weekend small{color:var(--black);}
  .day.empty{visibility:hidden; border:none; background:none; pointer-events:none;}
  .day.disabled{opacity:.25; cursor:not-allowed; pointer-events:none;}

  @media (max-width:480px){
    .modal-box{padding:20px 16px;}
    .row-sub{display:none;}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>Админка</h1>
    <p>Дело Мэри — вход по паролю</p>
    <div class="pw-field">
      <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password">
      <button type="button" class="pw-toggle" id="loginPwToggle" aria-label="Показать пароль">
        <svg id="loginEyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <button class="btn" id="loginSubmit">Войти</button>
    <div class="err-msg" id="loginErr"></div>
  </div>
</div>

<div id="panel">
  <div class="wrap">
    <div class="topbar">
      <h1>Брони — Дело Мэри</h1>
      <div class="topbar-actions">
        <button class="btn-secondary" id="refreshBtn">Обновить</button>
        <button class="btn-secondary" id="statsBtn">Статистика</button>
        <button class="btn-secondary" id="closeDayBtn">Закрыть день</button>
        <button class="btn" id="addTechBtn" style="width:auto; background:var(--ochre-bright);">+ Новая бронь</button>
        <button class="btn-secondary" id="logoutBtn">Выйти</button>
      </div>
    </div>
    <div class="list-toolbar">
      <input type="text" id="searchBox" placeholder="Поиск по имени или телефону…">
      <button class="btn-secondary" id="todayToggleBtn">Сегодня</button>
      <button class="btn-secondary" id="exportCsvBtn">Экспорт CSV</button>
    </div>
    <div id="listContainer"><div class="load-note">Загрузка…</div></div>
  </div>
</div>

<!-- Booking detail modal -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal-box">
    <button class="modal-close-x" data-close="detail">✕</button>
    <h2 id="detailTitle">Бронь</h2>

    <div id="detailView">
      <div class="detail-field"><label>Тип</label><div class="value" id="dvType"></div></div>
      <div class="detail-field"><label>Имя</label><div class="value" id="dvName"></div></div>
      <div class="detail-field"><label>Телефон</label><div class="value" id="dvPhone"></div></div>
      <div class="detail-field"><label>Игроков</label><div class="value" id="dvPlayers"></div></div>
      <div class="detail-field"><label>Цена</label><div class="value" id="dvPrice"></div></div>
      <div class="detail-field"><label>Комментарий</label><div class="value" id="dvComment"></div></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="rescheduleBtn">Перенести</button>
        <button class="btn-secondary" id="editBtn">Редактировать</button>
        <button class="btn-danger" id="cancelBookingBtn">Отменить</button>
      </div>
    </div>

    <div id="editView" style="display:none;">
      <div class="detail-field"><label>Имя</label><input id="editName"></div>
      <div class="detail-field"><label>Телефон</label><input id="editPhone"></div>
      <div class="detail-field"><label>Игроков</label><input id="editPlayers"></div>
      <div class="detail-field"><label>Цена</label><input id="editPrice"></div>
      <div class="detail-field"><label>Комментарий</label><textarea id="editComment" rows="3"></textarea></div>
      <div class="modal-actions">
        <button class="btn" id="saveEditBtn">Сохранить</button>
        <button class="btn-secondary" id="cancelEditBtn">Назад</button>
      </div>
    </div>

    <div id="rescheduleView" style="display:none;">
      <div class="detail-field">
        <label>Новая дата</label>
        <div class="cal-head">
          <button type="button" class="cal-nav" id="reschedCalPrev" aria-label="Предыдущий месяц">‹</button>
          <span class="cal-month" id="reschedCalMonthLabel"></span>
          <button type="button" class="cal-nav" id="reschedCalNext" aria-label="Следующий месяц">›</button>
        </div>
        <div class="cal-weekdays">
          <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
        </div>
        <div class="cal-grid" id="reschedCalGrid"></div>
      </div>
      <div class="detail-field">
        <label>Новое время</label>
        <div class="slot-grid" id="rescheduleSlots"></div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="saveRescheduleBtn">Перенести бронь</button>
        <button class="btn-secondary" id="cancelRescheduleBtn">Назад</button>
      </div>
    </div>

    <div class="modal-msg" id="detailMsg"></div>
  </div>
</div>

<!-- Cancel confirmation modal -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal-box" style="max-width:380px;">
    <h2 style="font-size:17px;">Отменить бронь?</h2>
    <p style="color:var(--muted); font-size:14px; margin:0 0 4px;" id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn-danger" id="confirmYes">Да, отменить</button>
      <button class="btn-secondary" id="confirmNo">Нет</button>
    </div>
  </div>
</div>

<!-- New booking modal (real customer booking or technical block) -->
<div class="modal-overlay" id="techOverlay">
  <div class="modal-box">
    <button class="modal-close-x" data-close="tech">✕</button>
    <h2 id="techTitle">Новая бронь</h2>

    <div class="type-toggle" id="bookingTypeToggle">
      <button type="button" class="type-toggle-btn active" data-type="customer">Клиент</button>
      <button type="button" class="type-toggle-btn" data-type="technical">Техническая</button>
    </div>

    <div class="detail-field">
      <label>Дата</label>
      <div class="cal-head">
        <button type="button" class="cal-nav" id="techCalPrev" aria-label="Предыдущий месяц">‹</button>
        <span class="cal-month" id="techCalMonthLabel"></span>
        <button type="button" class="cal-nav" id="techCalNext" aria-label="Следующий месяц">›</button>
      </div>
      <div class="cal-weekdays">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
      </div>
      <div class="cal-grid" id="techCalGrid"></div>
    </div>
    <div class="detail-field">
      <label>Время</label>
      <div class="slot-grid" id="techSlots"></div>
    </div>

    <div id="customerFields">
      <div class="detail-field"><label>Имя клиента</label><input id="techName" placeholder="Имя"></div>
      <div class="detail-field"><label>Телефон</label><input id="techPhone" placeholder="+375 (__) ___-__-__"></div>
      <div class="detail-field"><label>Количество игроков</label><select id="techPlayers"></select></div>
      <div class="detail-field"><label>Цена (можно исправить вручную)</label><input id="techPrice" inputmode="numeric" placeholder="Рассчитается автоматически"></div>
    </div>

    <div class="detail-field">
      <label id="techCommentLabel">Комментарий (необязательно)</label>
      <textarea id="techComment" rows="3" maxlength="500" placeholder="Например: уборка, съёмки, ремонт"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" id="techSubmitBtn">Создать бронь</button>
      <button class="btn-secondary" id="techCancelBtn">Отмена</button>
    </div>
    <div class="modal-msg" id="techMsg"></div>
  </div>
</div>

<!-- Close/open a whole day -->
<div class="modal-overlay" id="closeDayOverlay">
  <div class="modal-box">
    <button class="modal-close-x" data-close="closeDay">✕</button>
    <h2>Закрыть или открыть день</h2>

    <div class="detail-field">
      <label>Дата</label>
      <div class="cal-head">
        <button type="button" class="cal-nav" id="closeDayCalPrev" aria-label="Предыдущий месяц">‹</button>
        <span class="cal-month" id="closeDayCalMonthLabel"></span>
        <button type="button" class="cal-nav" id="closeDayCalNext" aria-label="Следующий месяц">›</button>
      </div>
      <div class="cal-weekdays">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
      </div>
      <div class="cal-grid" id="closeDayCalGrid"></div>
    </div>

    <div class="day-status" id="closeDayStatus"></div>

    <div class="detail-field">
      <label>Комментарий (необязательно)</label>
      <textarea id="closeDayComment" rows="2" maxlength="500" placeholder="Например: выходной, техобслуживание"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn" id="closeDaySubmitBtn">Закрыть весь день</button>
      <button class="btn-secondary" id="openDaySubmitBtn">Открыть день</button>
    </div>
    <div class="modal-msg" id="closeDayMsg"></div>
  </div>
</div>

<!-- Stats dashboard -->
<div class="modal-overlay" id="statsOverlay">
  <div class="modal-box" style="max-width:720px;">
    <button class="modal-close-x" data-close="stats">✕</button>
    <h2>Статистика броней</h2>
    <div id="statsBody"><div class="load-note">Загрузка…</div></div>
  </div>
</div>

<script>
(function(){
  const SLOTS = ['11:00','12:30','14:00','15:30','17:00','18:30','20:00','21:30','23:00'];
  const LATE_IDX = 8;
  const BOOKING_DAYS_AHEAD = 65;
  const WEEKDAY_TIERS = [
    {max:2, price:140, people:'1–2 человека'},
    {max:4, price:160, people:'3–4 человека'},
    {max:5, price:190, people:'5 человек'},
    {max:6, price:220, people:'6 человек'}
  ];
  const WEEKEND_TIERS = [
    {max:2, price:160, people:'1–2 человека'},
    {max:4, price:180, people:'3–4 человека'},
    {max:5, price:210, people:'5 человек'},
    {max:6, price:240, people:'6 человек'}
  ];
  function tiersFor(weekend){ return weekend ? WEEKEND_TIERS : WEEKDAY_TIERS; }
  const WEEKDAY_NAMES = ['вс','пн','вт','ср','чт','пт','сб'];
  const MONTH_NAMES = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const MONTH_NAMES_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const WEEKDAY_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс']; // Monday-first, for the calendar grid cells

  let adminPassword = null;
  let allBookings = [];
  let activeBooking = null; // the booking currently open in the detail modal
  let searchQuery = '';
  let showTodayOnly = false;

  // ---------- helpers ----------
  function todayISO(){
    const d = new Date();
    d.setHours(0,0,0,0);
    return isoDate(d);
  }
  function isoDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function maxDateISO(){
    const d = new Date();
    d.setDate(d.getDate() + BOOKING_DAYS_AHEAD);
    return isoDate(d);
  }
  function parseISO(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function isWeekendISO(iso){
    const dow = parseISO(iso).getDay();
    return dow === 0 || dow === 6;
  }
  function formatDateHeading(iso){
    const d = parseISO(iso);
    const wd = WEEKDAY_NAMES[d.getDay()];
    return `${d.getDate()} ${MONTH_NAMES[d.getMonth()]}, ${wd}`;
  }
  // Auto-format phone numbers as +375 (XX) XXX-XX-XX while typing, so every
  // booking entered by hand ends up in the same shape as ones from the site.
  function formatByPhone(raw){
    let digits = raw.replace(/\D/g, '');
    if (digits.startsWith('375')) digits = digits.slice(3);
    else if (digits.startsWith('80')) digits = digits.slice(2);
    else if (digits.startsWith('0')) digits = digits.slice(1);
    digits = digits.slice(0, 9);
    if (!digits) return '';
    let out = '+375 (' + digits.slice(0, 2);
    if (digits.length >= 2) out += ')';
    if (digits.length > 2) out += ' ' + digits.slice(2, 5);
    if (digits.length > 5) out += '-' + digits.slice(5, 7);
    if (digits.length > 7) out += '-' + digits.slice(7, 9);
    return out;
  }
  function attachPhoneMask(el){
    if (!el) return;
    el.addEventListener('input', () => { el.value = formatByPhone(el.value); });
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function authHeaders(){
    return { 'Content-Type':'application/json', 'X-Admin-Password': adminPassword || '' };
  }

  // ---------- login ----------
  const loginScreen = document.getElementById('loginScreen');
  const panel = document.getElementById('panel');
  const loginPassword = document.getElementById('loginPassword');
  const loginPwToggle = document.getElementById('loginPwToggle');
  const loginEyeIcon = document.getElementById('loginEyeIcon');
  const loginSubmit = document.getElementById('loginSubmit');
  const loginErr = document.getElementById('loginErr');

  loginPwToggle.addEventListener('click', () => {
    const showing = loginPassword.type === 'text';
    loginPassword.type = showing ? 'password' : 'text';
    loginEyeIcon.innerHTML = showing
      ? '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>'
      : '<path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/><path d="M9.9 4.24A11 11 0 0 1 12 4c7 0 11 7 11 7a13.4 13.4 0 0 1-3.17 3.88M6.6 6.6C3.87 8.36 2 11 2 11s4 7 11 7a10.9 10.9 0 0 0 5.4-1.4"/>';
  });

  async function tryLogin(){
    const pw = loginPassword.value;
    if (!pw){ loginErr.textContent = 'Введите пароль.'; return; }
    loginSubmit.disabled = true;
    loginErr.textContent = '';
    try{
      const res = await fetch('/api/admin/login', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw })
      });
      const out = await res.json().catch(() => ({}));
      if (res.ok && out.ok){
        adminPassword = pw;
        localStorage.setItem('adminPassword', pw);
        showPanel();
      } else {
        loginErr.textContent = out.error || 'Неверный пароль.';
      }
    } catch(err){
      loginErr.textContent = 'Не удалось связаться с сервером. Попробуйте ещё раз.';
    } finally {
      loginSubmit.disabled = false;
    }
  }
  loginSubmit.addEventListener('click', tryLogin);
  loginPassword.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    adminPassword = null;
    localStorage.removeItem('adminPassword');
    panel.style.display = 'none';
    loginScreen.style.display = 'flex';
    loginPassword.value = '';
  });

  function showPanel(){
    loginScreen.style.display = 'none';
    panel.style.display = 'block';
    loadBookings();
  }

  // ---------- loading & rendering the bookings list ----------
  const listContainer = document.getElementById('listContainer');

  async function loadBookings(){
    listContainer.innerHTML = '<div class="load-note">Загрузка…</div>';
    try{
      const res = await fetch('/api/admin/bookings', { headers: authHeaders(), cache:'no-store' });
      if (res.status === 401){
        adminPassword = null;
        localStorage.removeItem('adminPassword');
        panel.style.display = 'none';
        loginScreen.style.display = 'flex';
        loginErr.textContent = 'Сессия истекла — войдите снова.';
        return;
      }
      const out = await res.json().catch(() => ({}));
      allBookings = Array.isArray(out.bookings) ? out.bookings : [];
      renderList();
    } catch(err){
      listContainer.innerHTML = '<div class="empty-note">Не удалось загрузить брони. Проверьте соединение и нажмите «Обновить».</div>';
    }
  }

  function takenTimesFor(dateISO, excludeBooking){
    return allBookings
      .filter(b => b.dateISO === dateISO && b !== excludeBooking)
      .map(b => b.time);
  }

  // Applies the search box and "today only" toggle on top of allBookings.
  // Kept separate from renderList so CSV export can reuse exactly what's
  // currently on screen.
  function getFilteredBookings(){
    let list = allBookings;
    if (showTodayOnly){
      const today = todayISO();
      list = list.filter(b => b.dateISO === today);
    }
    const q = searchQuery.trim().toLowerCase();
    if (q){
      list = list.filter(b => {
        const name = (b.name || '').toLowerCase();
        const phone = (b.phone || '').toLowerCase();
        return name.includes(q) || phone.includes(q);
      });
    }
    return list;
  }

  function renderList(){
    if (!allBookings.length){
      listContainer.innerHTML = '<div class="empty-note">Броней пока нет.</div>';
      return;
    }
    const filtered = getFilteredBookings();
    if (!filtered.length){
      listContainer.innerHTML = '<div class="empty-note">Ничего не найдено — попробуйте изменить поиск или отключить фильтр «Сегодня».</div>';
      return;
    }
    const byDate = {};
    filtered.forEach(b => {
      (byDate[b.dateISO] = byDate[b.dateISO] || []).push(b);
    });
    const dates = Object.keys(byDate).sort();

    listContainer.innerHTML = dates.map(dateISO => {
      const weekend = isWeekendISO(dateISO);
      const rows = byDate[dateISO]
        .slice()
        .sort((a,b) => a.time.localeCompare(b.time))
        .map(b => {
          const isTech = b.type === 'technical';
          const name = isTech ? 'Техническая бронь' : (b.name || '—');
          const sub = isTech
            ? (b.comment || '')
            : [b.phone, b.source === 'admin' ? 'внесено вручную' : null].filter(Boolean).join(' · ');
          const priceLabel = (!isTech && b.price) ? `${escapeHtml(b.price)} Br` : '';
          return `
            <div class="booking-row" data-date="${dateISO}" data-time="${escapeHtml(b.time)}">
              <div class="row-time">${escapeHtml(b.time)}</div>
              <div class="row-type ${isTech ? 'technical' : 'customer'}">${isTech ? 'Техническая' : 'Клиент'}</div>
              <div class="row-main">
                <div class="row-name">${escapeHtml(name)}${!isTech && b.players ? ` · ${escapeHtml(b.players)}` : ''}</div>
                ${sub ? `<div class="row-sub">${escapeHtml(sub)}</div>` : ''}
              </div>
              ${priceLabel ? `<div class="row-price">${priceLabel}</div>` : ''}
            </div>`;
        }).join('');

      return `
        <div class="day-group">
          <div class="day-heading">${formatDateHeading(dateISO)}${weekend ? ' <span class="weekend-tag">· выходной</span>' : ''}</div>
          ${rows}
        </div>`;
    }).join('');

    listContainer.querySelectorAll('.booking-row').forEach(row => {
      row.addEventListener('click', () => {
        const { date, time } = row.dataset;
        const booking = allBookings.find(b => b.dateISO === date && b.time === time);
        if (booking) openDetail(booking);
      });
    });
  }

  document.getElementById('refreshBtn').addEventListener('click', loadBookings);

  // ---------- toolbar: search, "today only" toggle, CSV export ----------
  const searchBox = document.getElementById('searchBox');
  const todayToggleBtn = document.getElementById('todayToggleBtn');
  const exportCsvBtn = document.getElementById('exportCsvBtn');

  searchBox.addEventListener('input', () => {
    searchQuery = searchBox.value;
    renderList();
  });

  todayToggleBtn.addEventListener('click', () => {
    showTodayOnly = !showTodayOnly;
    todayToggleBtn.classList.toggle('active', showTodayOnly);
    renderList();
  });

  function csvEscape(value){
    const s = String(value == null ? '' : value);
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  exportCsvBtn.addEventListener('click', () => {
    const rows = getFilteredBookings().slice().sort((a,b) => {
      return a.dateISO === b.dateISO ? a.time.localeCompare(b.time) : a.dateISO.localeCompare(b.dateISO);
    });
    if (!rows.length){
      alert('Нет броней для экспорта — измените фильтр поиска.');
      return;
    }
    const header = ['Дата','Время','Тип','Имя','Телефон','Игроки','Цена','Комментарий','Источник'];
    const lines = [header.join(';')];
    rows.forEach(b => {
      const isTech = b.type === 'technical';
      lines.push([
        b.dateISO || '',
        b.time || '',
        isTech ? 'Техническая' : 'Клиент',
        isTech ? '' : (b.name || ''),
        isTech ? '' : (b.phone || ''),
        isTech ? '' : (b.players || ''),
        isTech ? '' : (b.price != null ? b.price : ''),
        b.comment || '',
        b.source === 'admin' ? 'вручную' : (b.source || '')
      ].map(csvEscape).join(';'));
    });
    // Leading BOM so Excel opens Cyrillic text as UTF-8 instead of guessing wrong.
    const csvContent = '﻿' + lines.join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `брони_${todayISO()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // ---------- detail modal ----------
  const detailOverlay = document.getElementById('detailOverlay');
  const detailView = document.getElementById('detailView');
  const editView = document.getElementById('editView');
  const rescheduleView = document.getElementById('rescheduleView');
  const detailMsg = document.getElementById('detailMsg');

  function resetDetailViews(){
    detailView.style.display = 'block';
    editView.style.display = 'none';
    rescheduleView.style.display = 'none';
    detailMsg.textContent = '';
    detailMsg.className = 'modal-msg';
  }

  function openDetail(booking){
    activeBooking = booking;
    resetDetailViews();
    const isTech = booking.type === 'technical';
    document.getElementById('detailTitle').textContent =
      `${isTech ? 'Техническая бронь' : 'Бронь'} · ${formatDateHeading(booking.dateISO)} в ${booking.time}`;
    document.getElementById('dvType').textContent = isTech ? 'Техническая (слот заблокирован)' : 'Клиентская бронь';
    document.getElementById('dvName').textContent = booking.name || '—';
    document.getElementById('dvPhone').textContent = booking.phone || '—';
    document.getElementById('dvPlayers').textContent = booking.players || '—';
    document.getElementById('dvPrice').textContent = booking.price ? `${booking.price} Br` : '—';
    document.getElementById('dvComment').textContent = booking.comment || '—';
    detailOverlay.classList.add('show');
  }

  function closeDetail(){
    detailOverlay.classList.remove('show');
    activeBooking = null;
  }

  document.querySelectorAll('[data-close="detail"]').forEach(b => b.addEventListener('click', closeDetail));
  detailOverlay.addEventListener('click', e => { if (e.target === detailOverlay) closeDetail(); });

  // -- edit --
  document.getElementById('editBtn').addEventListener('click', () => {
    if (!activeBooking) return;
    detailView.style.display = 'none';
    editView.style.display = 'block';
    document.getElementById('editName').value = activeBooking.name || '';
    document.getElementById('editPhone').value = activeBooking.phone || '';
    document.getElementById('editPlayers').value = activeBooking.players || '';
    document.getElementById('editPrice').value = activeBooking.price || '';
    document.getElementById('editComment').value = activeBooking.comment || '';
  });
  document.getElementById('cancelEditBtn').addEventListener('click', resetDetailViews);

  document.getElementById('saveEditBtn').addEventListener('click', async () => {
    if (!activeBooking) return;
    const payload = {
      action:'edit',
      dateISO: activeBooking.dateISO,
      time: activeBooking.time,
      name: document.getElementById('editName').value,
      phone: document.getElementById('editPhone').value,
      players: document.getElementById('editPlayers').value,
      price: document.getElementById('editPrice').value,
      comment: document.getElementById('editComment').value,
    };
    try{
      const res = await fetch('/api/admin/bookings', { method:'POST', headers: authHeaders(), body: JSON.stringify(payload) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok){ detailMsg.textContent = out.error || 'Не удалось сохранить.'; detailMsg.className = 'modal-msg err'; return; }
      await loadBookings();
      closeDetail();
    } catch(err){
      detailMsg.textContent = 'Ошибка сети. Попробуйте ещё раз.'; detailMsg.className = 'modal-msg err';
    }
  });

  // -- reschedule --
  const rescheduleSlots = document.getElementById('rescheduleSlots');
  let rescheduleSelectedTime = null;
  let reschedSelectedDateISO = null;

  const reschedCalGrid = document.getElementById('reschedCalGrid');
  const reschedCalMonthLabel = document.getElementById('reschedCalMonthLabel');
  const reschedCalPrev = document.getElementById('reschedCalPrev');
  const reschedCalNext = document.getElementById('reschedCalNext');
  let reschedCalViewYear, reschedCalViewMonth;

  function renderReschedCalendar(){
    reschedCalGrid.innerHTML = '';
    reschedCalMonthLabel.textContent = MONTH_NAMES_NOM[reschedCalViewMonth] + ' ' + reschedCalViewYear;

    const firstOfMonth = new Date(reschedCalViewYear, reschedCalViewMonth, 1);
    const leadEmpty = (firstOfMonth.getDay() + 6) % 7;
    for (let i = 0; i < leadEmpty; i++) {
      const filler = document.createElement('div');
      filler.className = 'day empty';
      reschedCalGrid.appendChild(filler);
    }

    const daysInMonth = new Date(reschedCalViewYear, reschedCalViewMonth + 1, 0).getDate();
    const minD = parseISO(todayISO());
    const maxD = parseISO(maxDateISO());
    for (let dnum = 1; dnum <= daysInMonth; dnum++) {
      const d = new Date(reschedCalViewYear, reschedCalViewMonth, dnum);
      const iso = isoDate(d);
      const weekend = d.getDay() === 0 || d.getDay() === 6;
      const inRange = d >= minD && d <= maxD;
      const isSelected = iso === reschedSelectedDateISO;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'day' + (weekend ? ' weekend' : '') + (!inRange ? ' disabled' : '') + (isSelected ? ' active' : '');
      btn.innerHTML = '<small>' + WEEKDAY_SHORT[(d.getDay() + 6) % 7] + '</small>' + dnum;
      if (!inRange) {
        btn.disabled = true;
      } else {
        btn.addEventListener('click', () => {
          reschedSelectedDateISO = iso;
          rescheduleSelectedTime = null;
          renderReschedCalendar();
          renderRescheduleSlots();
        });
      }
      reschedCalGrid.appendChild(btn);
    }

    const prevMonthLastDay = new Date(reschedCalViewYear, reschedCalViewMonth, 0);
    reschedCalPrev.disabled = prevMonthLastDay < new Date(minD.getFullYear(), minD.getMonth(), 1);
    const nextMonthFirstDay = new Date(reschedCalViewYear, reschedCalViewMonth + 1, 1);
    reschedCalNext.disabled = nextMonthFirstDay > maxD;
  }
  reschedCalPrev.addEventListener('click', () => {
    if (reschedCalPrev.disabled) return;
    reschedCalViewMonth--; if (reschedCalViewMonth < 0){ reschedCalViewMonth = 11; reschedCalViewYear--; }
    renderReschedCalendar();
  });
  reschedCalNext.addEventListener('click', () => {
    if (reschedCalNext.disabled) return;
    reschedCalViewMonth++; if (reschedCalViewMonth > 11){ reschedCalViewMonth = 0; reschedCalViewYear++; }
    renderReschedCalendar();
  });

  function renderRescheduleSlots(){
    const dateISO = reschedSelectedDateISO;
    const taken = dateISO ? takenTimesFor(dateISO, activeBooking) : [];
    rescheduleSlots.innerHTML = SLOTS.map(s => {
      const isTaken = taken.includes(s);
      const isActive = s === rescheduleSelectedTime;
      return `<button type="button" class="slot-btn ${isTaken ? 'taken':''} ${isActive ? 'active':''}" data-time="${s}">${s}</button>`;
    }).join('');
    rescheduleSlots.querySelectorAll('.slot-btn:not(.taken)').forEach(btn => {
      btn.addEventListener('click', () => {
        rescheduleSelectedTime = btn.dataset.time;
        renderRescheduleSlots();
      });
    });
  }

  document.getElementById('rescheduleBtn').addEventListener('click', () => {
    if (!activeBooking) return;
    detailView.style.display = 'none';
    rescheduleView.style.display = 'block';
    const initialD = parseISO(activeBooking.dateISO);
    reschedCalViewYear = initialD.getFullYear();
    reschedCalViewMonth = initialD.getMonth();
    reschedSelectedDateISO = activeBooking.dateISO;
    rescheduleSelectedTime = null;
    renderReschedCalendar();
    renderRescheduleSlots();
  });
  document.getElementById('cancelRescheduleBtn').addEventListener('click', resetDetailViews);

  document.getElementById('saveRescheduleBtn').addEventListener('click', async () => {
    if (!activeBooking) return;
    if (!reschedSelectedDateISO || !rescheduleSelectedTime){
      detailMsg.textContent = 'Выберите дату и время.'; detailMsg.className = 'modal-msg err'; return;
    }
    const payload = {
      action:'reschedule',
      fromDateISO: activeBooking.dateISO,
      fromTime: activeBooking.time,
      toDateISO: reschedSelectedDateISO,
      toTime: rescheduleSelectedTime,
    };
    try{
      const res = await fetch('/api/admin/bookings', { method:'POST', headers: authHeaders(), body: JSON.stringify(payload) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok){ detailMsg.textContent = out.error || 'Не удалось перенести бронь.'; detailMsg.className = 'modal-msg err'; return; }
      await loadBookings();
      closeDetail();
    } catch(err){
      detailMsg.textContent = 'Ошибка сети. Попробуйте ещё раз.'; detailMsg.className = 'modal-msg err';
    }
  });

  // -- cancel --
  const confirmOverlay = document.getElementById('confirmOverlay');
  document.getElementById('cancelBookingBtn').addEventListener('click', () => {
    if (!activeBooking) return;
    document.getElementById('confirmText').textContent =
      `${formatDateHeading(activeBooking.dateISO)} в ${activeBooking.time}${activeBooking.name ? ' — ' + activeBooking.name : ''}`;
    confirmOverlay.classList.add('show');
  });
  document.getElementById('confirmNo').addEventListener('click', () => confirmOverlay.classList.remove('show'));
  confirmOverlay.addEventListener('click', e => { if (e.target === confirmOverlay) confirmOverlay.classList.remove('show'); });

  document.getElementById('confirmYes').addEventListener('click', async () => {
    if (!activeBooking) return;
    try{
      const res = await fetch('/api/admin/bookings', {
        method:'POST', headers: authHeaders(),
        body: JSON.stringify({ action:'cancel', dateISO: activeBooking.dateISO, time: activeBooking.time })
      });
      const out = await res.json().catch(() => ({}));
      confirmOverlay.classList.remove('show');
      if (!res.ok){ detailMsg.textContent = out.error || 'Не удалось отменить бронь.'; detailMsg.className = 'modal-msg err'; return; }
      await loadBookings();
      closeDetail();
    } catch(err){
      confirmOverlay.classList.remove('show');
      detailMsg.textContent = 'Ошибка сети. Попробуйте ещё раз.'; detailMsg.className = 'modal-msg err';
    }
  });

  // ---------- technical booking modal ----------
  const techOverlay = document.getElementById('techOverlay');
  const techSlots = document.getElementById('techSlots');
  const techComment = document.getElementById('techComment');
  const techCommentLabel = document.getElementById('techCommentLabel');
  const techMsg = document.getElementById('techMsg');
  const techTitle = document.getElementById('techTitle');
  const techSubmitBtn = document.getElementById('techSubmitBtn');
  const customerFields = document.getElementById('customerFields');
  const techName = document.getElementById('techName');
  const techPhone = document.getElementById('techPhone');
  const techPlayers = document.getElementById('techPlayers');
  const techPrice = document.getElementById('techPrice');
  let techSelectedTime = null;
  let techSelectedDateISO = null;
  let techTierIdx = 0;
  let bookingType = 'customer'; // 'customer' | 'technical'

  const techCalGrid = document.getElementById('techCalGrid');
  const techCalMonthLabel = document.getElementById('techCalMonthLabel');
  const techCalPrev = document.getElementById('techCalPrev');
  const techCalNext = document.getElementById('techCalNext');
  let techCalViewYear, techCalViewMonth;

  function renderTechCalendar(){
    techCalGrid.innerHTML = '';
    techCalMonthLabel.textContent = MONTH_NAMES_NOM[techCalViewMonth] + ' ' + techCalViewYear;

    const firstOfMonth = new Date(techCalViewYear, techCalViewMonth, 1);
    const leadEmpty = (firstOfMonth.getDay() + 6) % 7;
    for (let i = 0; i < leadEmpty; i++) {
      const filler = document.createElement('div');
      filler.className = 'day empty';
      techCalGrid.appendChild(filler);
    }

    const daysInMonth = new Date(techCalViewYear, techCalViewMonth + 1, 0).getDate();
    const minD = parseISO(todayISO());
    const maxD = parseISO(maxDateISO());
    for (let dnum = 1; dnum <= daysInMonth; dnum++) {
      const d = new Date(techCalViewYear, techCalViewMonth, dnum);
      const iso = isoDate(d);
      const weekend = d.getDay() === 0 || d.getDay() === 6;
      const inRange = d >= minD && d <= maxD;
      const isSelected = iso === techSelectedDateISO;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'day' + (weekend ? ' weekend' : '') + (!inRange ? ' disabled' : '') + (isSelected ? ' active' : '');
      btn.innerHTML = '<small>' + WEEKDAY_SHORT[(d.getDay() + 6) % 7] + '</small>' + dnum;
      if (!inRange) {
        btn.disabled = true;
      } else {
        btn.addEventListener('click', () => {
          techSelectedDateISO = iso;
          techSelectedTime = null;
          renderTechCalendar();
          renderTechSlots();
          buildTechPlayersOptions();
        });
      }
      techCalGrid.appendChild(btn);
    }

    const prevMonthLastDay = new Date(techCalViewYear, techCalViewMonth, 0);
    techCalPrev.disabled = prevMonthLastDay < new Date(minD.getFullYear(), minD.getMonth(), 1);
    const nextMonthFirstDay = new Date(techCalViewYear, techCalViewMonth + 1, 1);
    techCalNext.disabled = nextMonthFirstDay > maxD;
  }
  techCalPrev.addEventListener('click', () => {
    if (techCalPrev.disabled) return;
    techCalViewMonth--; if (techCalViewMonth < 0){ techCalViewMonth = 11; techCalViewYear--; }
    renderTechCalendar();
  });
  techCalNext.addEventListener('click', () => {
    if (techCalNext.disabled) return;
    techCalViewMonth++; if (techCalViewMonth > 11){ techCalViewMonth = 0; techCalViewYear++; }
    renderTechCalendar();
  });

  function renderTechSlots(){
    const dateISO = techSelectedDateISO;
    const taken = dateISO ? takenTimesFor(dateISO, null) : [];
    techSlots.innerHTML = SLOTS.map(s => {
      const isTaken = taken.includes(s);
      const isActive = s === techSelectedTime;
      return `<button type="button" class="slot-btn ${isTaken ? 'taken':''} ${isActive ? 'active':''}" data-time="${s}">${s}</button>`;
    }).join('');
    techSlots.querySelectorAll('.slot-btn:not(.taken)').forEach(btn => {
      btn.addEventListener('click', () => {
        techSelectedTime = btn.dataset.time;
        renderTechSlots();
        buildTechPlayersOptions();
      });
    });
  }

  function buildTechPlayersOptions(){
    if (bookingType !== 'customer') return;
    const weekend = techSelectedDateISO ? isWeekendISO(techSelectedDateISO) : false;
    const late = techSelectedTime === SLOTS[LATE_IDX];
    const surcharge = late ? 20 : 0;
    const list = tiersFor(weekend);
    if (techTierIdx > list.length - 1) techTierIdx = 0;
    techPlayers.innerHTML = list.map((t,i) =>
      `<option value="${i}">${t.people}: ${t.price + surcharge} Br</option>`
    ).join('');
    techPlayers.value = String(techTierIdx);
    techPrice.value = list[techTierIdx].price + surcharge;
  }
  techPlayers.addEventListener('change', () => {
    techTierIdx = Number(techPlayers.value);
    buildTechPlayersOptions();
  });

  function setBookingType(type){
    bookingType = type;
    document.querySelectorAll('.type-toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
    if (type === 'customer'){
      customerFields.style.display = 'block';
      techTitle.textContent = 'Новая бронь клиента';
      techSubmitBtn.textContent = 'Создать бронь';
      techCommentLabel.textContent = 'Комментарий (необязательно)';
      techComment.placeholder = 'Например: пожелания, повод визита';
      buildTechPlayersOptions();
    } else {
      customerFields.style.display = 'none';
      techTitle.textContent = 'Техническая бронь';
      techSubmitBtn.textContent = 'Заблокировать слот';
      techCommentLabel.textContent = 'Комментарий (необязательно)';
      techComment.placeholder = 'Например: уборка, съёмки, ремонт';
    }
  }
  document.querySelectorAll('.type-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => setBookingType(btn.dataset.type));
  });

  function openTechModal(){
    const t = parseISO(todayISO());
    techCalViewYear = t.getFullYear();
    techCalViewMonth = t.getMonth();
    techSelectedDateISO = todayISO();
    techSelectedTime = null;
    techTierIdx = 0;
    techName.value = '';
    techPhone.value = '';
    techPrice.value = '';
    techComment.value = '';
    techMsg.textContent = '';
    techMsg.className = 'modal-msg';
    setBookingType('customer');
    renderTechCalendar();
    renderTechSlots();
    techOverlay.classList.add('show');
  }
  document.getElementById('addTechBtn').addEventListener('click', openTechModal);
  document.getElementById('techCancelBtn').addEventListener('click', () => techOverlay.classList.remove('show'));
  document.querySelectorAll('[data-close="tech"]').forEach(b => b.addEventListener('click', () => techOverlay.classList.remove('show')));
  techOverlay.addEventListener('click', e => { if (e.target === techOverlay) techOverlay.classList.remove('show'); });

  document.getElementById('techSubmitBtn').addEventListener('click', async () => {
    if (!techSelectedDateISO || !techSelectedTime){
      techMsg.textContent = 'Выберите дату и время.'; techMsg.className = 'modal-msg err'; return;
    }

    const payload = { action:'create', type: bookingType, dateISO: techSelectedDateISO, time: techSelectedTime, comment: techComment.value };

    if (bookingType === 'customer'){
      const name = techName.value.trim();
      const phone = techPhone.value.trim();
      if (!name || !phone){
        techMsg.textContent = 'Укажите имя и телефон клиента.'; techMsg.className = 'modal-msg err'; return;
      }
      const tier = tiersFor(techSelectedDateISO ? isWeekendISO(techSelectedDateISO) : false)[techTierIdx];
      payload.name = name;
      payload.phone = phone;
      payload.players = tier ? tier.people : '';
      payload.price = techPrice.value.trim() || (tier ? tier.price : '');
    }

    try{
      const res = await fetch('/api/admin/bookings', {
        method:'POST', headers: authHeaders(),
        body: JSON.stringify(payload)
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok){ techMsg.textContent = out.error || 'Не удалось создать бронь.'; techMsg.className = 'modal-msg err'; return; }
      await loadBookings();
      techOverlay.classList.remove('show');
    } catch(err){
      techMsg.textContent = 'Ошибка сети. Попробуйте ещё раз.'; techMsg.className = 'modal-msg err';
    }
  });

  attachPhoneMask(document.getElementById('editPhone'));
  attachPhoneMask(document.getElementById('techPhone'));

  // ---------- close / open a whole day ----------
  const closeDayOverlay = document.getElementById('closeDayOverlay');
  const closeDayStatus = document.getElementById('closeDayStatus');
  const closeDayComment = document.getElementById('closeDayComment');
  const closeDayMsg = document.getElementById('closeDayMsg');
  const closeDaySubmitBtn = document.getElementById('closeDaySubmitBtn');
  const openDaySubmitBtn = document.getElementById('openDaySubmitBtn');
  let closeDaySelectedDateISO = null;

  const closeDayCalGrid = document.getElementById('closeDayCalGrid');
  const closeDayCalMonthLabel = document.getElementById('closeDayCalMonthLabel');
  const closeDayCalPrev = document.getElementById('closeDayCalPrev');
  const closeDayCalNext = document.getElementById('closeDayCalNext');
  let closeDayCalViewYear, closeDayCalViewMonth;

  function renderCloseDayCalendar(){
    closeDayCalGrid.innerHTML = '';
    closeDayCalMonthLabel.textContent = MONTH_NAMES_NOM[closeDayCalViewMonth] + ' ' + closeDayCalViewYear;

    const firstOfMonth = new Date(closeDayCalViewYear, closeDayCalViewMonth, 1);
    const leadEmpty = (firstOfMonth.getDay() + 6) % 7;
    for (let i = 0; i < leadEmpty; i++) {
      const filler = document.createElement('div');
      filler.className = 'day empty';
      closeDayCalGrid.appendChild(filler);
    }

    const daysInMonth = new Date(closeDayCalViewYear, closeDayCalViewMonth + 1, 0).getDate();
    const minD = parseISO(todayISO());
    const maxD = parseISO(maxDateISO());
    for (let dnum = 1; dnum <= daysInMonth; dnum++) {
      const d = new Date(closeDayCalViewYear, closeDayCalViewMonth, dnum);
      const iso = isoDate(d);
      const weekend = d.getDay() === 0 || d.getDay() === 6;
      const inRange = d >= minD && d <= maxD;
      const isSelected = iso === closeDaySelectedDateISO;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'day' + (weekend ? ' weekend' : '') + (!inRange ? ' disabled' : '') + (isSelected ? ' active' : '');
      btn.innerHTML = '<small>' + WEEKDAY_SHORT[(d.getDay() + 6) % 7] + '</small>' + dnum;
      if (!inRange) {
        btn.disabled = true;
      } else {
        btn.addEventListener('click', () => {
          closeDaySelectedDateISO = iso;
          renderCloseDayCalendar();
          updateCloseDayStatus();
        });
      }
      closeDayCalGrid.appendChild(btn);
    }

    const prevMonthLastDay = new Date(closeDayCalViewYear, closeDayCalViewMonth, 0);
    closeDayCalPrev.disabled = prevMonthLastDay < new Date(minD.getFullYear(), minD.getMonth(), 1);
    const nextMonthFirstDay = new Date(closeDayCalViewYear, closeDayCalViewMonth + 1, 1);
    closeDayCalNext.disabled = nextMonthFirstDay > maxD;
  }
  closeDayCalPrev.addEventListener('click', () => {
    if (closeDayCalPrev.disabled) return;
    closeDayCalViewMonth--; if (closeDayCalViewMonth < 0){ closeDayCalViewMonth = 11; closeDayCalViewYear--; }
    renderCloseDayCalendar();
  });
  closeDayCalNext.addEventListener('click', () => {
    if (closeDayCalNext.disabled) return;
    closeDayCalViewMonth++; if (closeDayCalViewMonth > 11){ closeDayCalViewMonth = 0; closeDayCalViewYear++; }
    renderCloseDayCalendar();
  });

  function updateCloseDayStatus(){
    if (!closeDaySelectedDateISO){ closeDayStatus.innerHTML = ''; return; }
    const dayBookings = allBookings.filter(b => b.dateISO === closeDaySelectedDateISO);
    const technical = dayBookings.filter(b => b.type === 'technical').length;
    const customer = dayBookings.filter(b => b.type !== 'technical').length;
    const open = Math.max(0, SLOTS.length - technical - customer);
    closeDayStatus.innerHTML = `<b>${formatDateHeading(closeDaySelectedDateISO)}</b>: занято клиентами — ${customer}, закрыто технически — ${technical}, свободно — ${open} из ${SLOTS.length}.`;
    openDaySubmitBtn.disabled = technical === 0;
    closeDaySubmitBtn.disabled = open === 0;
  }

  function openCloseDayModal(){
    const t = parseISO(todayISO());
    closeDayCalViewYear = t.getFullYear();
    closeDayCalViewMonth = t.getMonth();
    closeDaySelectedDateISO = todayISO();
    closeDayComment.value = '';
    closeDayMsg.textContent = '';
    closeDayMsg.className = 'modal-msg';
    renderCloseDayCalendar();
    updateCloseDayStatus();
    closeDayOverlay.classList.add('show');
  }
  document.getElementById('closeDayBtn').addEventListener('click', openCloseDayModal);
  document.querySelectorAll('[data-close="closeDay"]').forEach(b => b.addEventListener('click', () => closeDayOverlay.classList.remove('show')));
  closeDayOverlay.addEventListener('click', e => { if (e.target === closeDayOverlay) closeDayOverlay.classList.remove('show'); });

  closeDaySubmitBtn.addEventListener('click', async () => {
    if (!closeDaySelectedDateISO) return;
    closeDaySubmitBtn.disabled = true;
    try{
      const res = await fetch('/api/admin/bookings', {
        method:'POST', headers: authHeaders(),
        body: JSON.stringify({ action:'blockDay', dateISO: closeDaySelectedDateISO, comment: closeDayComment.value })
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok){ closeDayMsg.textContent = out.error || 'Не удалось закрыть день.'; closeDayMsg.className = 'modal-msg err'; return; }
      closeDayMsg.textContent = `Закрыто слотов: ${out.blocked}${out.alreadyTaken ? `, уже было занято: ${out.alreadyTaken}` : ''}.`;
      closeDayMsg.className = 'modal-msg ok';
      await loadBookings();
      updateCloseDayStatus();
    } catch(err){
      closeDayMsg.textContent = 'Ошибка сети. Попробуйте ещё раз.'; closeDayMsg.className = 'modal-msg err';
    } finally {
      closeDaySubmitBtn.disabled = false;
    }
  });

  openDaySubmitBtn.addEventListener('click', async () => {
    if (!closeDaySelectedDateISO) return;
    openDaySubmitBtn.disabled = true;
    try{
      const res = await fetch('/api/admin/bookings', {
        method:'POST', headers: authHeaders(),
        body: JSON.stringify({ action:'unblockDay', dateISO: closeDaySelectedDateISO })
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok){ closeDayMsg.textContent = out.error || 'Не удалось открыть день.'; closeDayMsg.className = 'modal-msg err'; return; }
      closeDayMsg.textContent = `Открыто слотов: ${out.unblocked}.`;
      closeDayMsg.className = 'modal-msg ok';
      await loadBookings();
      updateCloseDayStatus();
    } catch(err){
      closeDayMsg.textContent = 'Ошибка сети. Попробуйте ещё раз.'; closeDayMsg.className = 'modal-msg err';
    } finally {
      openDaySubmitBtn.disabled = false;
    }
  });

  // ---------- stats dashboard ----------
  const statsOverlay = document.getElementById('statsOverlay');
  const statsBody = document.getElementById('statsBody');

  function fmtShortDate(iso){
    const d = parseISO(iso);
    return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function buildStatsChartSvg(byDay){
    const W = 640, H = 200, padBottom = 26, padTop = 6;
    const chartH = H - padBottom - padTop;
    const n = byDay.length;
    const slot = W / n;
    const barW = Math.min(24, slot - 4);
    const maxTotal = Math.max(1, ...byDay.map(d => d.completed + d.cancelled));
    const gap = 2;
    const radius = 4;
    const baseline = padTop + chartH;

    let bars = '';
    byDay.forEach((d, i) => {
      const x = i * slot + (slot - barW) / 2;
      const total = d.completed + d.cancelled;
      const completedH = total > 0 ? (d.completed / maxTotal) * chartH : 0;
      const cancelledH = total > 0 ? (d.cancelled / maxTotal) * chartH : 0;
      const title = escapeHtml(formatDateHeading(d.dateISO)) + ': завершено ' + d.completed + ', отменено ' + d.cancelled;

      if (total === 0) {
        bars += `<rect x="${x}" y="${baseline - 1}" width="${barW}" height="1" fill="#2a2a2a"><title>${title}</title></rect>`;
        return;
      }

      let cursorY = baseline;
      if (d.completed > 0) {
        const y = cursorY - completedH;
        if (d.cancelled === 0) {
          const rr = Math.min(radius, completedH, barW / 2);
          bars += `<rect x="${x}" y="${y}" width="${barW}" height="${completedH}" rx="${rr}" fill="#008300"><title>${title}</title></rect>`;
          if (completedH > rr) bars += `<rect x="${x}" y="${y + completedH - rr}" width="${barW}" height="${rr}" fill="#008300"/>`;
        } else {
          bars += `<rect x="${x}" y="${y}" width="${barW}" height="${completedH}" fill="#008300"><title>${title}</title></rect>`;
        }
        cursorY = y - gap;
      }
      if (d.cancelled > 0) {
        const y = cursorY - cancelledH;
        const rr = Math.min(radius, cancelledH, barW / 2);
        bars += `<rect x="${x}" y="${y}" width="${barW}" height="${cancelledH}" rx="${rr}" fill="#e66767"><title>${title}</title></rect>`;
        if (cancelledH > rr) bars += `<rect x="${x}" y="${y + cancelledH - rr}" width="${barW}" height="${rr}" fill="#e66767"/>`;
      }
    });

    const labelIdxs = [0, Math.floor((n - 1) / 2), n - 1];
    let labels = '';
    labelIdxs.forEach(i => {
      const x = i * slot + slot / 2;
      labels += `<text x="${x}" y="${H - 8}" font-size="10" fill="#8a8a80" text-anchor="middle" font-family="Manrope, Arial, sans-serif">${fmtShortDate(byDay[i].dateISO)}</text>`;
    });

    const axisLine = `<line x1="0" y1="${baseline}" x2="${W}" y2="${baseline}" stroke="#2a2a2a" stroke-width="1"/>`;

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">${axisLine}${bars}${labels}</svg>`;
  }

  function renderStats(data){
    const decided = data.completed + data.cancelled;
    const rateText = decided > 0 ? String(data.cancelRate).replace(/\.0$/, '') + '%' : '—';
    const kpis = `
      <div class="stats-kpis">
        <div class="stat-tile stat-completed"><div class="stat-label">Проведено</div><div class="stat-value">${data.completed}</div></div>
        <div class="stat-tile stat-cancelled"><div class="stat-label">Отменено</div><div class="stat-value">${data.cancelled}</div></div>
        <div class="stat-tile"><div class="stat-label">Предстоит</div><div class="stat-value">${data.upcoming}</div></div>
        <div class="stat-tile"><div class="stat-label">Техн. закрыто</div><div class="stat-value">${data.technical}</div></div>
      </div>
      <div class="stats-meter-wrap">
        <div class="stats-meter-label"><span>Доля отмен</span><b>${rateText}</b></div>
        <div class="stats-meter-track"><div class="stats-meter-fill" style="width:${decided > 0 ? Math.min(100, data.cancelRate) : 0}%"></div></div>
      </div>
      <div class="stats-source">Источник броней: через сайт — <b>${data.sourceSite}</b>, вручную в админке — <b>${data.sourceAdmin}</b></div>
      <div class="stats-chart-head">
        <span class="stats-chart-title">Последние 21 день</span>
        <div class="stats-legend">
          <span><i style="background:#008300"></i>Завершено</span>
          <span><i style="background:#e66767"></i>Отменено</span>
        </div>
      </div>
    `;

    const hasChartData = data.byDay.some(d => d.completed + d.cancelled > 0);
    const chart = hasChartData
      ? buildStatsChartSvg(data.byDay)
      : '<div class="stats-empty">За последние 21 день пока нет ни одной завершённой или отменённой брони.</div>';

    const tableRows = data.byDay.map(d =>
      `<tr><td>${formatDateHeading(d.dateISO)}</td><td>${d.completed}</td><td>${d.cancelled}</td></tr>`
    ).join('');
    const table = `
      <table class="stats-table" id="statsTable" hidden>
        <thead><tr><th>Дата</th><th>Завершено</th><th>Отменено</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    `;

    statsBody.innerHTML = kpis + chart +
      '<div style="text-align:right; margin-top:8px;"><button class="stats-toggle-table" id="statsToggleTableBtn">Показать таблицей</button></div>' +
      table;

    document.getElementById('statsToggleTableBtn').addEventListener('click', () => {
      const t = document.getElementById('statsTable');
      const btn = document.getElementById('statsToggleTableBtn');
      const showing = !t.hidden;
      t.hidden = showing;
      btn.textContent = showing ? 'Показать таблицей' : 'Скрыть таблицу';
    });
  }

  async function openStatsModal(){
    statsBody.innerHTML = '<div class="load-note">Загрузка…</div>';
    statsOverlay.classList.add('show');
    try{
      const res = await fetch('/api/admin/bookings', {
        method:'POST', headers: authHeaders(),
        body: JSON.stringify({ action:'stats' })
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok){
        statsBody.innerHTML = `<div class="stats-empty">${escapeHtml(out.error || 'Не удалось загрузить статистику.')}</div>`;
        return;
      }
      renderStats(out);
    } catch(err){
      statsBody.innerHTML = '<div class="stats-empty">Ошибка сети. Попробуйте ещё раз.</div>';
    }
  }
  document.getElementById('statsBtn').addEventListener('click', openStatsModal);
  document.querySelectorAll('[data-close="stats"]').forEach(b => b.addEventListener('click', () => statsOverlay.classList.remove('show')));
  statsOverlay.addEventListener('click', e => { if (e.target === statsOverlay) statsOverlay.classList.remove('show'); });

  // ---------- boot ----------
  const savedPassword = localStorage.getItem('adminPassword');
  if (savedPassword){
    adminPassword = savedPassword;
    showPanel();
  }
})();
</script>
</body>
</html>
